<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Four-minute talk timer</title><style>
*{box-sizing:border-box}body{margin:0;background:#d5f2dc;color:#14221b;font-family:system-ui,-apple-system,sans-serif;transition:background 1s;min-height:100svh;display:grid;place-items:center}body.yellow{background:#ffe07a;color:#332700}body.red{background:#f06b68;color:#310b0b}main{width:100%;text-align:center;padding:30px 20px}header{font-size:14px;font-weight:700;letter-spacing:.22em}#clock{font-size:clamp(100px,25vw,290px);font-weight:750;line-height:1.2;letter-spacing:-.055em;font-variant-numeric:tabular-nums;margin:22px 0 0}#status{height:40px;font-size:clamp(20px,3vw,32px);font-weight:600;margin-bottom:30px}.controls{display:flex;justify-content:center;gap:16px}button{font:600 21px system-ui;border:2px solid #14221b25;border-radius:18px;padding:20px 34px;background:#ffffff70;color:inherit;touch-action:manipulation;cursor:pointer;min-width:135px}button:focus-visible{outline:4px solid #2656c9;outline-offset:4px}#toggle{background:#17251e;color:white;border-color:transparent}.extras{margin-top:28px;display:flex;gap:22px;justify-content:center;align-items:center;flex-wrap:wrap}.extras button{font-size:15px;min-width:0;padding:12px 18px}label{display:flex;align-items:center;gap:10px;font-size:15px}input{width:100px}footer{font-size:13px;opacity:.7;margin-top:24px}#audioNote{font-size:13px;min-height:18px;margin-top:12px}@media(max-height:550px){main{padding:15px}#clock{font-size:30vh;margin:0}#status{margin-bottom:12px}.extras{margin-top:12px}footer{margin-top:12px}}
</style></head><body><main><header>FOUR-MINUTE TALKS</header><div id="clock" role="timer" aria-label="Time remaining">4:00</div><div id="status" aria-live="polite">Ready when you are</div><div class="controls"><button id="toggle">Start</button><button id="reset">Reset</button></div><div class="extras"><button id="test">Test music</button><label>Volume <input id="volume" aria-label="Music volume" type="range" min="0" max="1" step=".05" value=".65"></label></div><div id="audioNote"></div><footer>Yellow at 1:00 · Red at 0:00 · Music fades in over 20 seconds<br>Keep this screen open and your iPad volume up. · Audio v2</footer></main><script>
const $=id=>document.getElementById(id);let remaining=240000,deadline=0,running=false,ended=false,ctx,master,track,previewTimer,wake;
function render(){let s=Math.ceil(Math.max(0,remaining)/1000);$('clock').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');document.body.className=ended?'red':remaining<=60000?'yellow':'';$('toggle').textContent=running?'Pause':ended?'Resume music':remaining<240000?'Resume':'Start';let msg=ended?'Time’s up — wrap it up':!running?(remaining<240000?'Paused':'Ready when you are'):remaining<=60000?'One minute left':'You have the floor';if($('status').textContent!==msg)$('status').textContent=msg}
function initAudio(){try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume().then(()=>{$('audioNote').textContent=ctx.state==='running'?'Audio ready · If silent, check Control Center → Silent Mode.':'Audio paused — tap Test music again.'}).catch(()=>{$('audioNote').textContent='Audio unavailable. Try Test music again.'});if(!master){master=ctx.createGain();master.gain.value=Number($('volume').value);master.connect(ctx.destination)}return true}catch(e){$('audioNote').textContent='Audio is unavailable in this preview.';return false}}
function note(bus,midi,time,len,type,level){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=440*Math.pow(2,(midi-69)/12);g.gain.setValueAtTime(0,time);g.gain.linearRampToValueAtTime(level,time+.07);g.gain.exponentialRampToValueAtTime(.0001,time+len);o.connect(g);g.connect(bus);o.start(time);o.stop(time+len+.05)}
function stopMusic(){clearTimeout(previewTimer);if(track){clearInterval(track.scheduler);track.bus.disconnect();track=null}$('test').textContent='Test music'}
function music(test=false){stopMusic();if(!initAudio())return;const bus=ctx.createGain(),start=ctx.currentTime+.06;bus.connect(master);bus.gain.setValueAtTime(test?.65:.001,start);bus.gain.linearRampToValueAtTime(.65,start+(test?.1:20));let bar=0,next=start;const chords=[[48,55,60,64],[45,52,57,60],[53,60,65,69],[55,62,65,71]],melody=[[76,79,81,79,76,74],[72,76,79,76,72,71],[69,72,77,79,77,76],[74,77,79,83,81,79]];function schedule(){while(next<ctx.currentTime+3){const c=chords[bar%4],m=melody[bar%4];c.forEach(n=>{note(bus,n,next,2.7,'triangle',.075);note(bus,n+12,next,2.6,'sine',.024)});m.forEach((n,i)=>note(bus,n,next+i*.45,.7,'triangle',.095));next+=2.7;bar++}}schedule();track={bus,scheduler:setInterval(schedule,350)}}
async function keepAwake(){try{if(!wake&&navigator.wakeLock)wake=await navigator.wakeLock.request('screen')}catch(e){}}function releaseWake(){if(wake){wake.release();wake=null}}
function tick(){if(running&&!ended){remaining=Math.max(0,deadline-Date.now());if(remaining===0){ended=true;music()}}render()}
$('toggle').onclick=()=>{if(running){tick();running=false;stopMusic();releaseWake()}else{initAudio();stopMusic();running=true;deadline=Date.now()+remaining;if(ended)music();keepAwake()}render()};
$('reset').onclick=()=>{running=false;ended=false;remaining=240000;stopMusic();releaseWake();render()};
$('test').onclick=()=>{if(track){stopMusic();return}music(true);if(track){$('test').textContent='Stop music';previewTimer=setTimeout(stopMusic,25000)}};
$('volume').oninput=()=>{if(master)master.gain.setTargetAtTime(Number($('volume').value),ctx.currentTime,.1)};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&running){tick();wake=null;keepAwake()}});setInterval(tick,100);render();
</script></body></html>
