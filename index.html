<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Daniel Burkhardt. Personal website.">
  <meta name="theme-color" content="#f5f3ee">
  <title>Daniel Burkhardt</title>
  <link rel="canonical" href="https://dburkhardt.github.io/">
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #242822; background: #f5f3ee; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 2rem; }
    main { width: min(100%, 64rem); padding-block: 4rem; }
    .rule { width: 3rem; height: 3px; background: #79836b; margin-bottom: 2rem; }
    h1 { margin: 0; font-size: clamp(2.5rem, 8vw, 6rem); line-height: 1.05; font-weight: 600; letter-spacing: -0.055em; }
    p { margin: 1.5rem 0 0; color: #686c63; font-size: 1.1rem; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <div class="rule" aria-hidden="true"></div>
    <h1>Daniel Burkhardt</h1>
    <p>Personal website.</p>
  </main>
</body>
</html>
